name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit

      - name: Syntax check
        run: for f in *.lua tests/*.lua; do luajit -bl "$f" > /dev/null || exit 1; done

      - name: Data tests
        run: luajit tests/Data_test.lua
