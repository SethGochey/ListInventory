name: Release

# Pushing a tag like v1.0.0 builds the addon zip with the BigWigs packager, attaches it to a
# GitHub release, and uploads it to CurseForge, Wago and WoWInterface for every site whose
# project ID is in ListInventory.toc and whose API token secret is set.
# Tags work on any branch: a tag push runs the workflow file from the tagged commit, so a
# feature branch can be tagged (for example v0.1.0-beta) to test a build before merging.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit
          luajit tests/Data_test.lua

      - name: Package and release
        uses: BigWigsMods/packager@v2
